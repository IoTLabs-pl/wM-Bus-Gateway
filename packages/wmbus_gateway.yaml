substitutions:
  hw_variant: Gen1

packages:
  hal: !include hal_${hw_variant | lower}.yaml
  display: !include
    file: display.yaml
    condition: ${hw_variant in ['Gen1', 'Gen2']}
  version: !include version.yaml

external_components:
  - source: 
      type: git
      url: https://github.com/IoTLabs-pl/ESPHome-Components
      ref: ${esphome_components_version}
    components:
      - wmbus_common
      - wmbus_radio
      - wmbus_meter

esphome:
  name: wmbus-gateway
  min_version: 2026.10.0
  friendly_name: wM-Bus Gateway ${hw_variant}
  comment: wM-Bus Gateway for ESPHome
  project:
    name: IoTLabs.wM-Bus Gateway ${hw_variant}
    version: ${wmbus_gateway_version}
  platformio_options:
    upload_speed: 921600

wmbus_radio:
  id: wmbus_radio_component
  on_frame:
    - then:
        - repeat:
            count: 20
            then:
              - light.control:
                  id: wmbus_gateway_status_led
                  state: !lambda return iteration % 2 == 0;
              - delay: 50ms

logger:
  level: debug
  baud_rate: 115200
  hardware_uart: UART0
  logs:
    light: INFO
    status_led: INFO
