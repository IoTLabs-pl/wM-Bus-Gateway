substitutions:
  hw_variant: Gen1

packages:
  hal: !include hal_${hw_variant | lower}.yaml
  resources: !include resources.yaml
  version: !include version.yaml

external_components:
  - source: 
      type: git
      url: https://github.com/IoTLabs-pl/ESPHome-Components
      ref: ${esphome_components_version}
    components:
      - wmbus_common
      - wmbus_radio
      - wmbus_meter
  - source: 
      type: git
      url: https://github.com/IoTLabs-pl/wM-Bus-Gateway
      ref: ${wmbus_gateway_version}
    components:
      - wmbus_gateway

esphome:
  name: wmbus-gateway
  friendly_name: wM-Bus Gateway ${hw_variant}
  comment: wM-Bus Gateway for ESPHome
  project:
    name: IoTLabs.wM-Bus Gateway ${hw_variant}
    version: ${wmbus_gateway_version}
  platformio_options:
    upload_speed: 921600

wmbus_radio:
  id: wmbus_radio_component
  on_frame:
    - then:
        - repeat:
            count: 20
            then:
              - light.control:
                  id: wmbus_gateway_status_led
                  state: !lambda return iteration % 2 == 0;
              - delay: 50ms

wmbus_gateway:
  resources:
    font_large: font_large
    font_small: font_small
    qrcode: qrcode
    logo: logo

logger:
  level: debug
  baud_rate: 115200
  logs:
    light: INFO
    status_led: INFO
