packages:
  wmbus_gateway: !include packages/wmbus_gateway_${hw_variant | lower}.yaml

esphome:
  name: wmbus-gateway-${hw_variant | lower}

improv_serial:

improv_ble:
  authorizer: none

wifi:
  ap:
    ssid: IoTLabs wM-Bus Gateway

ota:
  - platform: esphome
  - platform: web_server

api:

captive_portal:

dashboard_import:
  package_import_url: github://IoTLabs-pl/wM-Bus-Gateway/blueprints/blueprint_${hw_variant | lower}.yaml@latest
  import_full_config: true

web_server:
  version: 3

wmbus_radio:
  on_frame:
    - then:
        - logger.log:
            level: WARN
            format: "Meter ID: %s"
            args: ["frame->meter_id().c_str()"]
        - logger.log:
            level: WARN
            format: "Frame: https://wmbusmeters.org/analyze/%s"
            args: ["frame->as_hex().c_str()"]

button:
  - platform: restart
    name: Restart

debug:
  update_interval: 15s

time:
  - platform: sntp

sensor:
  - platform: uptime
    name: Uptime
    type: timestamp
  - platform: wifi_signal
    name: RSSI
    update_interval: 60s
  - platform: debug
    free:
      name: Free Heap
      device_class: data_size
      state_class: measurement
