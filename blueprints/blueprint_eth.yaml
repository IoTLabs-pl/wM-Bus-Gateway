packages:
  wmbus_gateway: github://IoTLabs-pl/wM-Bus-Gateway/packages/wmbus_gateway_eth.yaml@v1.2.4

esphome:
  friendly_name: wM-Bus Gateway ETH

# To use Wi-Fi when no Ethernet cable is connected, uncomment both sections.
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#
# network:
#   priority:
#     - ethernet
#     - wifi

# Updates over the network.
ota:
  - platform: esphome

# For Home Assistant.
api:

# For an MQTT broker, instead of the API or along with it.
# mqtt:
#   broker: mqtt.example.com
#   username: !secret mqtt_username
#   password: !secret mqtt_password

wmbus_radio:
  # Logs every received frame with a link to decode it; remove this section for a quiet log.
  on_frame:
    - then:
        - logger.log:
            level: WARN
            format: "Meter ID: %s"
            args: ["frame->meter_id().c_str()"]
        - logger.log:
            level: WARN
            format: "Frame: https://iotlabs.pl/decoder?telegram=%s&rssi=%d"
            args: ["frame->as_hex().c_str()", "frame->rssi()"]

wmbus_meter:
  # This part of config is responsible for handling the received frames
  # for the specified meter. You may send whole decoded datagram everywhere
  # You may specify multiple meters.
  - id: my_meter
    meter_id: 12345678
    type: apator162
    key: 00112233445566778899aabbccddeeff # Optional, if your meter is encrypted. May be specified as ASCII or HEX string.
    # on_telegram:
    # Sending telegram to MQTT topic as JSON. MQTT component must be configured in your config.
    #   - then: 
    #       - wmbus_meter.send_telegram_with_mqtt:
    #           topic: some_topic
    # Sending telegram to HTTP endpoint as JSON.
    #   - then:
    #       - http_request.post:
    #           url: http://example.com/api
    #           headers:
    #             Content-Type: application/json
    #           body: !lambda |-
    #             return meter->as_json();

sensor:
  # This part of config is responsible for extracting specific fields
  # from the meter data and making them available as sensors.
  # By default, unit of measurement is determined from the field.
  # You may specify unit of measurement to override it.
  # All parameters from https://esphome.io/components/sensor/index.html are supported.
  - platform: wmbus_meter
    id: total_water_sensor
    field: total_m3
    parent_id: my_meter
    name: Water Consumption
    state_class: total_increasing
    device_class: water
  - platform: wmbus_meter
    id: water_meter_rssi
    field: rssi_dbm
    parent_id: my_meter
    name: RSSI
    device_class: signal_strength
    state_class: measurement
