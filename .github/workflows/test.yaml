name: Test firmware

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hw_variant:
          - gen1
          - gen2
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build firmware with local components
        id: build_firmware
        uses: esphome/build-action@v8.1.0
        with:
          version: "2026.9.1"
          yaml-file: tests/ci.yaml
          substitutions: |
            hw_variant=${{ matrix.hw_variant }}
