name: Build release firmware

on:
  release:
    types:
      - published

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        hw_variant:
          - gen1
          - gen2
          - eth
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Build firmware
        id: build_firmware
        uses: esphome/build-action@v8.1.0
        with:
          version: "2026.10.0"
          yaml-file: factory.yaml
          substitutions: |
            hw_variant=${{ matrix.hw_variant }}
          complete-manifest: true
      - name: Rename manifest file
        working-directory: ${{ steps.build_firmware.outputs.name }}
        run: |
          mv manifest.json ${{ steps.build_firmware.outputs.name }}.manifest.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-build-${{ matrix.hw_variant }}
          path: |
            ${{ steps.build_firmware.outputs.name }}/*.factory.bin
            ${{ steps.build_firmware.outputs.name }}/*.manifest.json

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
      - name: Upload binaries to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/**/*.factory.bin
            release-artifacts/**/*.manifest.json
